<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Analytics</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <h2>Analytics</h2>
      <button class="btn btn-secondary btn-sm" onclick="seedData()">Seed Demo Data</button>
    </div>
    <div class="page-body">
      <div id="overview-stats" class="stat-grid mb-4"></div>

      <div class="chart-container mb-4">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Platform Breakdown</h3>
        <div id="platform-chart"></div>
      </div>

      <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Top Tracks</h3>
      <div id="top-tracks"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Copyright</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <h2>Copyright Management</h2>
    </div>
    <div class="page-body">
      <p class="text-sm text-secondary mb-4">AI prepares your copyright filing. You review and confirm before submission. <strong>TurboTax for copyright.</strong></p>

      <div class="stat-grid mb-4">
        <div class="stat-card"><div class="stat-label">Not Started</div><div id="stat-not-started" class="stat-value">0</div></div>
        <div class="stat-card"><div class="stat-label">In Progress</div><div id="stat-in-progress" class="stat-value">0</div></div>
        <div class="stat-card"><div class="stat-label">Registered</div><div id="stat-registered" class="stat-value">0</div></div>
      </div>

      <div class="card mb-4">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Prepare New Filing</h3>
        <div class="flex gap-4">
          <div class="form-group" style="flex:1">
            <label>Select Release</label>
            <select id="copyright-release" onchange="loadReleaseTracks()">
              <option value="">-- Select release --</option>
            </select>
          </div>
          <div class="form-group" style="flex:1">
            <label>Select Track</label>
            <select id="copyright-track">
              <option value="">-- Select track --</option>
            </select>
          </div>
          <div style="padding-top:22px">
            <button class="btn btn-primary" onclick="prepareFiling()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg>
              AI Prepare Filing
            </button>
          </div>
        </div>
      </div>

      <div id="filing-result" class="hidden card mb-4"></div>

      <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">All Copyright Registrations</h3>
      <div id="copyrights-table"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/copyright.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Dashboard</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <h2>Dashboard</h2>
      <button class="btn btn-primary" onclick="createRelease()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Release
      </button>
    </div>
    <div class="page-body">
      <div id="stats" class="stat-grid"></div>
      <div id="releases" class="card-grid"></div>
      <div id="empty" class="empty-state hidden">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <h3>No releases yet</h3>
        <p>Create your first release to start building your release pipeline.</p>
        <button class="btn btn-primary" onclick="createRelease()">Create Release</button>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Distribution</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <h2>Distribution</h2>
    </div>
    <div class="page-body">
      <div class="flex gap-4 mb-4">
        <div class="form-group" style="flex:1">
          <label>Select Release</label>
          <select id="dist-release" onchange="loadDistributions()">
            <option value="">-- Select release --</option>
          </select>
        </div>
        <div style="padding-top:22px">
          <button class="btn btn-primary" onclick="addAllPlatforms()">Add All Platforms</button>
        </div>
      </div>

      <div id="dist-grid" class="card-grid"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/distribution.js"></script>
</body>
</html>

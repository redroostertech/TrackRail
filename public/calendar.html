<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Calendar</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .cal-header { background: var(--bg-tertiary); padding: 8px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .cal-day { background: var(--bg-secondary); padding: 6px; min-height: 80px; font-size: 12px; }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { background: var(--accent-light); }
    .cal-day-num { font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .cal-event { padding: 2px 4px; border-radius: 3px; font-size: 10px; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-event.completed { opacity: 0.5; text-decoration: line-through; }
    .cal-event-upload { background: var(--info-light); color: var(--info); }
    .cal-event-metadata { background: var(--accent-light); color: var(--accent); }
    .cal-event-splits { background: var(--warning-light); color: var(--warning); }
    .cal-event-copyright { background: var(--accent-light); color: var(--accent); }
    .cal-event-pro { background: var(--accent-light); color: var(--accent); }
    .cal-event-distribution { background: var(--info-light); color: var(--info); }
    .cal-event-marketing { background: var(--success-light); color: var(--success); }
    .cal-event-launch { background: var(--error-light); color: var(--error); }
    .cal-event-custom { background: var(--bg-tertiary); color: var(--text-secondary); }
  </style>
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <div class="flex items-center gap-4">
        <h2>Release Calendar</h2>
        <div class="flex items-center gap-2">
          <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">&larr;</button>
          <span id="month-label" style="font-size:14px;font-weight:600;min-width:140px;text-align:center"></span>
          <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">&rarr;</button>
        </div>
      </div>
      <div class="flex gap-2">
        <select id="cal-release" onchange="loadCalendar()" class="select-inline">
          <option value="">All Releases</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="generateTimeline()">AI Generate Timeline</button>
      </div>
    </div>
    <div class="page-body">
      <div id="calendar"></div>

      <div class="mt-4">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Upcoming Milestones</h3>
        <div id="upcoming-list"></div>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>

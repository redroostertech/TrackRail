<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Upload</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <h2>Upload Tracks</h2>
    </div>
    <div class="page-body">
      <div class="form-group">
        <label>Select Release</label>
        <select id="release-select">
          <option value="">-- Select a release --</option>
        </select>
      </div>

      <div id="upload-area" class="upload-zone mb-4">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drag & drop audio files here, or click to browse</p>
        <small>Supports WAV, MP3, FLAC, AIFF, M4A, OGG (max 200MB)</small>
        <input type="file" id="file-input" multiple accept=".wav,.mp3,.flac,.aiff,.m4a,.ogg" style="display:none">
      </div>

      <div id="upload-progress" class="hidden mb-4"></div>

      <div id="uploaded-tracks">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">Uploaded Tracks</h3>
        <div id="tracks-table"></div>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/upload.js"></script>
</body>
</html>

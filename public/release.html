<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackRail - Release Detail</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <a href="/" class="text-sm text-muted" style="text-decoration:none">&larr; Back to Dashboard</a>
        <h2 id="release-title" style="margin-top:4px"></h2>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-secondary" onclick="editRelease()">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRelease()">Delete</button>
      </div>
    </div>
    <div class="page-body">
      <div id="release-meta" class="flex gap-4 mb-4"></div>
      <div id="release-pipeline" class="mb-4"></div>

      <div class="tabs">
        <div class="tab active" data-tab="tracks" onclick="switchTab('tracks')">Tracks</div>
        <div class="tab" data-tab="checklist" onclick="switchTab('checklist')">Checklist</div>
      </div>

      <div id="tab-tracks">
        <div class="flex items-center justify-between mb-4">
          <h3 style="font-size:14px;font-weight:600">Tracks</h3>
          <button class="btn btn-primary btn-sm" onclick="window.location='/upload.html?release=' + releaseId">Upload Track</button>
        </div>
        <div id="tracks-list"></div>
      </div>

      <div id="tab-checklist" class="hidden">
        <div id="checklist"></div>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dropdown.js"></script>
  <script src="/js/release.js"></script>
</body>
</html>
